  function saveForm(f) {
    if (f && f.id === 'f-expense') { saveExpense(f); return; }
    if (f && f.id === 'f-goal') { saveGoal(f); return; }
    if (!f || (f.id !== 'f-income' && f.id !== 'f-bill')) return;
    const isIn = f.id === 'f-income', fd = new FormData(f);
    const err = m => { const p = f.querySelector('.err'); p.textContent = m; };
    const kind = isIn && KINDS[fd.get('kind')] ? String(fd.get('kind')) : 'paycheck';
    const name = String(fd.get('name') || '').trim() || (isIn ? KINDS[kind] : '');
    const amount = parseMoney(fd.get('amount'));
    const start = String(fd.get('start') || ''), freq = String(fd.get('freq') || ''), end = String(fd.get('end') || '');
    if (!name) return err('Give the bill a name, like Rent or Phone.');
    if (amount == null || amount <= 0) return err('Enter an amount, like 620.00.');
    if (!isDate(start)) return err('Pick a date.');
    if ((isIn ? FREQ_IN : FREQ_BILL).indexOf(freq) < 0) return err('Choose how often it repeats.');
    if (freq !== 'once' && isDate(end) && end < start) return err('The last date is before the first one.');
    const id = f.dataset.id;
    const rule = { id: id || uid(), name: name.slice(0, 60), amount, freq, start };
    if (freq !== 'once' && isDate(end)) rule.end = end;
    if (freq === 'semimonthly') { rule.day1 = clampDay(fd.get('day1'), parts(start).d); rule.day2 = clampDay(fd.get('day2'), 15); }
    if (!isIn && fd.get('auto') === '1') rule.auto = true;
    if (!isIn && fd.get('nearest') === '1') rule.nearest = true;
    if (isIn) { rule.kind = kind; const lands = String(fd.get('lands') || '').trim().slice(0, 40); if (lands) rule.lands = lands; }
    const what = isIn ? 'income' : rule.auto ? 'subscription' : 'bill';
    const listName = isIn ? 'sources' : 'bills';
    closeAllSheets();
    commit(() => {
      const arr = S[listName], i = arr.findIndex(x => x.id === rule.id);
      if (i >= 0) arr[i] = rule; else arr.push(rule);
    }, {
      undo: !!id,
      log: (id ? 'Edited ' : 'Added ') + what + ': ' + rule.name + ', ' + money(rule.amount) + ', ' + describeRule(rule) + (rule.nearest ? ', taken from the nearest paycheck' : '') + '.',
      amt: id ? undefined : (isIn ? rule.amount : -rule.amount),
      toast: id ? 'Saved ' + rule.name + '.' : isIn ? 'Added ' + rule.name + '.' : rule.auto ? 'Added ' + rule.name + '. ' + (rule.nearest ? 'It comes out of the nearest paycheck and' : 'It') + ' marks itself paid on each due date.' : rule.nearest ? 'Added ' + rule.name + '. Each due date takes from the nearest paycheck.' : 'Added ' + rule.name + '. Tap it on the calendar to pick which check pays it.'
    });
    if (!id) selectDay(start, isIn ? { type: 'check', key: rule.id + '@' + start } : { type: 'bill', key: rule.id + '@' + start });
  }

  function saveExpense(f) {
    const fd = new FormData(f), err = m => { const p = f.querySelector('.err'); p.textContent = m; };
    const name = String(fd.get('name') || '').trim() || 'Unexpected expense';
    const amount = parseMoney(fd.get('amount')), ds = String(fd.get('ds') || ''), check = String(fd.get('check') || '');
    if (amount == null || amount <= 0) return err('Enter an amount, like 85.00.');
    if (!isDate(ds)) return err('Pick a date.');
    const id = f.dataset.id, c = check ? checkByKey(check) : null;
    const from = c ? ' from ' + checkWords(c) : '';
    const rec = { id: id || uid(), name: name.slice(0, 60), amount, ds, check: c ? c.key : null };
    closeSheet();
    if (topSheet() && topSheet().kind === 'add') closeSheet();
    commit(() => { const i = S.expenses.findIndex(x => x.id === rec.id); if (i >= 0) S.expenses[i] = rec; else S.expenses.push(rec); },
      { toast: 'Saved. ' + money(amount) + ' for ' + rec.name + from + '.', undo: true, log: (id ? 'Edited unexpected expense: ' : 'Unexpected expense: ') + rec.name + ', ' + money(amount) + from + '.', amt: id ? undefined : -amount });
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && tipFor) { e.preventDefault(); hideTip(); return; }
    if (sheetStack.length) {
      if (e.key === 'Escape') { e.preventDefault(); requestClose(); return; }
      if (e.key === 'Enter' && e.target.dataset && (e.target.dataset.inp || e.target.dataset.draft) && e.target.tagName === 'INPUT') { e.preventDefault(); e.target.blur(); return; }
      if (e.key === 'Tab') {
        const sh = $('#sheets .sheet');
        if (!sh) return;
        const f = $$('button,input,select,textarea,[tabindex]:not([tabindex="-1"])', sh).filter(x => !x.disabled && !x.closest('[hidden]'));
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (!sh.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
        else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    const t = e.target;
    if (t.classList && t.classList.contains('ftab') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Home' || e.key === 'End')) {
      e.preventDefault();
      const want = e.key === 'ArrowRight' || e.key === 'End' ? PAGES[1] : PAGES[0];
      if (UI.tab !== want) switchTab(want);
      const b = $('.ftab[data-tab="' + want + '"]');
      if (b) b.focus();
      return;
    }
    if (!t.classList || !t.classList.contains('tile')) return;
    const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
    if (!step) return;
    e.preventDefault();
    const ds = addDays(t.dataset.date, step);
    selectDay(ds);
    const nt = $('.tile[data-date="' + ds + '"]');
    if (nt) nt.focus();
  });

  document.addEventListener('scroll', () => { if (tipFor) hideTip(); }, true);
  window.addEventListener('resize', () => { if (tipFor) hideTip(); });

  // Drag sideways anywhere on the screen to switch pages. The other page follows your finger; let go past
  // about a quarter of the way (or flick) and it finishes the slide, otherwise it springs back.
  let drag = null, eatClick = false;
  const view = $('#view');
  document.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch' || PAGER.busy || sheetStack.length || drag) return;
    if (e.target.closest && e.target.closest('#sheets, #tip, #toast, .fab')) return;
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, lock: '', dx: 0, v: 0, lx: e.clientX, lt: e.timeStamp, w: view.clientWidth, from: UI.tab };
  });
  document.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (!drag.lock) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      if (Math.abs(dx) <= Math.abs(dy) * 1.15) { drag = null; return; }
      drag.lock = 'x';
      try { view.setPointerCapture(e.pointerId); } catch (err) { /* not a live pointer */ }
      hideTip();
      UI.scroll[drag.from] = window.scrollY;
      ensurePane(drag.from === 'cal' ? 'sum' : 'cal');
      drag.prep = drag.from === 'cal' ? prepIncoming($('#pane-sum'), UI.scroll.sum) : prepIncoming($('#pane-cal'), UI.scroll.cal);
      document.body.classList.add('dragging');
      $('#track').style.transition = 'none';
    }
    const dt = e.timeStamp - drag.lt;
    if (dt > 0) drag.v = (e.clientX - drag.lx) / dt;
    drag.lx = e.clientX; drag.lt = e.timeStamp; drag.dx = dx;
    const w = drag.w;
    let x = -PAGES.indexOf(drag.from) * w + dx;
    if (x > 0) x *= 0.25;
    if (x < -w) x = -w + (x + w) * 0.25;
    $('#track').style.transform = 'translate3d(' + x + 'px,0,0)';
  });
  const endDrag = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    if (!d.lock) return;
    eatClick = true;
    setTimeout(() => { eatClick = false; }, 450);
    const far = Math.abs(d.dx) > d.w * 0.22, flick = Math.abs(d.v) > 0.45 && e.timeStamp - d.lt < 120;
    let want = d.from;
    if (e.type === 'pointerup' && d.from === PAGES[0] && d.dx < 0 && (far || (flick && d.v < 0))) want = PAGES[1];
    if (e.type === 'pointerup' && d.from === PAGES[1] && d.dx > 0 && (far || (flick && d.v > 0))) want = PAGES[0];
    if (want !== d.from) updateTabs(want);
    settle(want, d.w, d.prep);
  };
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  // The tap that ends a drag shouldn't also press whatever was under your finger.
  document.addEventListener('click', e => { if (eatClick) { eatClick = false; e.stopPropagation(); e.preventDefault(); } }, true);

  // Follow the phone's light/dark changes live, and the viewer's own setting if it changes.
  if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: dark)'); const now = () => applyColor(true); if (mq.addEventListener) mq.addEventListener('change', now); else if (mq.addListener) mq.addListener(now); }
  if (window.MutationObserver) new MutationObserver(() => applyColor(true)).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && UI.today !== todayStr()) render();
  });

  /* ---------------- start ---------------- */
  canSave = storageWorks();
  const local = canSave ? loadLocal() : null;
  if (local) S = local;
  prune();
  reindex();
  UI.focus = defaultFocus(UI.sel);
  render();
})();

</script>
</body>
</html>

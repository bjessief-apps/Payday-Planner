/* base */
*,*::before,*::after{box-sizing:border-box}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));touch-action:pan-y pinch-zoom}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--page);color:var(--ink);font:16px/1.5 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body.dragging{-webkit-user-select:none;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);border:0}
svg{display:block;width:20px;height:20px}
.nw{white-space:nowrap}

/* header: an edge-to-edge banner that stays at the top */
.topbar{position:sticky;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--chrome-edge);background:var(--chrome);color:var(--chrome-ink);box-shadow:0 8px 20px -14px var(--chrome-shadow)}
.topin{display:flex;align-items:center;gap:8px;max-width:1100px;margin:0 auto}
.ftabs{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--seg-track)}
.ftab{min-width:0;padding:9px 12px;border:0;border-radius:9px;background:none;color:var(--seg-ink);font:600 15px/1.2 var(--sans)}
.ftab[aria-selected="true"]{background:var(--seg-on);color:var(--seg-on-ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.hbtns{display:flex;gap:8px}
.hbtn{flex:none;display:grid;place-items:center;width:42px;height:42px;padding:0;border:1px solid var(--chrome-btn-edge);border-radius:12px;background:var(--chrome-btn);color:var(--chrome-ink)}
.hbtn svg{width:20px;height:20px}

/* the page column and the two sliding pages */
#app{padding:0 0 104px}
.folder{max-width:1100px;margin:0 auto;background:var(--page)}
.pager{position:relative;overflow:hidden;overflow:clip}
.track{display:flex;align-items:flex-start;width:200%;will-change:transform}
.pane{flex:none;width:50%;min-width:0}
.pane.off{height:0;overflow:hidden;visibility:hidden}

/* flat full-width sections, separated by thin tinted bands */
.sec{padding:16px;background:var(--page)}
.sec + .sec,.story + .sec{border-top:8px solid var(--desk)}
.emptypage{margin:0;padding:32px 24px;color:var(--ink-2);font-size:16px;text-align:center}
.paper{padding:16px;background:var(--page)}
.mnav{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.mtitle{flex:1;margin:0;font:600 17px/1.2 var(--sans);letter-spacing:.07em;text-transform:uppercase;text-align:center;color:var(--month-ink)}
.navbtn{display:grid;place-items:center;width:44px;height:42px;border:1px solid var(--tile-edge);border-radius:10px;background:var(--btn);color:var(--month-ink)}
.navbtn svg{width:18px;height:18px}

/* calendar */
.calsec{padding:14px 12px 16px}
.calhead{display:flex;justify-content:center;margin:2px 0 12px;padding:0 4px}
.storydate{display:flex;align-items:baseline;gap:8px;margin:0 0 12px;padding:0;border:0;border-radius:8px;background:none;color:inherit}
.tdow{font:200 34px/1.1 var(--sans);letter-spacing:.04em;text-transform:uppercase}
.tnum{font:700 34px/1.1 var(--sans);color:color-mix(in srgb,var(--today-ink) 62%,transparent)}
.calmonth{flex:none;font-size:20px;letter-spacing:.1em;text-align:center}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:0 4px 6px;text-align:center;font:600 11.5px/1.4 var(--sans);color:var(--month-ink)}
.w3{display:none}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:4px;border-radius:12px;background:var(--grid-bg)}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;min-height:66px;padding:4px 4px 5px;border:1px solid var(--tile-edge);border-radius:8px;background:var(--tile);color:var(--ink);text-align:left}
.tile.out{border-color:transparent;background:var(--tile-out)}
.tile.out>*{opacity:.5}
.tile.past:not(.out):not(.today) .dn{color:var(--ink-2)}
.tile .dn{font:600 13px/1.2 var(--sans)}
.tile.today .dn{padding:1px 5px;border-radius:5px;background:var(--accent);color:var(--accent-ink)}
.tile.sel{padding:3px 3px 4px;border:2px solid var(--accent);box-shadow:0 4px 12px -4px color-mix(in srgb,var(--accent) 60%,transparent)}
.tile.linked{border-color:var(--lnk-edge);background:var(--lnk)}
.t-compact{display:flex;flex-direction:column;gap:2px;width:100%;min-width:0}
.t-chips{display:none}
.t-av{align-self:stretch;margin-top:auto;font:500 10px/1.2 var(--sans);text-align:right;color:var(--ink-2);white-space:nowrap}
.t-av.neg{color:var(--short)}
.hl{display:inline-block;max-width:100%;padding:1px 5px;border-radius:4px;background:var(--st-bg);box-shadow:inset 3px 0 0 var(--st);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-in,.t-out,.t-ex{display:block;font:600 10px/1.5 var(--sans)}
.hl-green,.t-in,.chip.inc{--st:var(--pay);--st-bg:var(--pay-bg)}
.t-in.over{--st:var(--short);--st-bg:var(--short-bg)}
.st-short{--st:var(--short);--st-bg:var(--short-bg)}
.st-partial{--st:var(--part);--st-bg:var(--part-bg)}
.st-planned{--st:var(--plan);--st-bg:var(--plan-bg)}
.st-paid,.st-done{--st:var(--paid);--st-bg:var(--paid-bg)}
.hl.st-paid,.chip.st-paid .nm,.chip.st-paid .am{text-decoration:line-through;color:var(--paid)}
.hl.t-ex,.chip.ex{background:transparent;box-shadow:none;color:var(--short)}
.tile.linked .hl{background:var(--lnk-chip)}
.calnav{justify-content:space-between;margin:12px 0 0}
.calnav .todaypill{min-height:42px;padding:0 16px;border-color:var(--tile-edge);color:var(--month-ink);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.navbtn.wide{display:inline-flex;align-items:center;gap:4px;width:auto;padding:0 12px;font:600 13px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}
.navbtn.wide svg{width:16px;height:16px}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:12px 2px 0;padding:0;list-style:none;font-size:13px;color:var(--ink-2)}
.legend li{display:flex;align-items:center}
.dot{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:3px;background:var(--c)}
.k-in{--c:var(--pay)}.k-short{--c:var(--short)}.k-part{--c:var(--part)}.k-plan{--c:var(--plan)}.k-paid{--c:var(--paid)}

/* the selected day: rows with a colored bar instead of boxes */
#dayh{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0;font:600 19px/1.3 var(--sans);color:var(--strip-ink)}
.dayhead{margin:-16px -16px 6px;padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--page-2);box-shadow:inset 4px 0 0 var(--accent)}
.dayhead .dayavail{margin:6px 0 0}
/* a day from another month: its own month's colors, washed out by the month on screen */
.day.away .slip::before,.day.away .stub::before,.day.away .xcard::before{opacity:.5}
.tag{display:inline-block;padding:4px 8px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:600 11px/1 var(--sans)}
.dayavail{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 6px;font-size:14px;color:var(--ink-2)}
.dayavail .lbl{font:500 13.5px/1.3 var(--sans)}
.dayavail b{padding:1px 8px;border-radius:6px;background:var(--spend);color:var(--spend-ink);font:600 15px/1.4 var(--sans)}
.dayavail b.neg{background:var(--short-bg);color:var(--short)}
.stack{display:grid}
.stack > * + *{border-top:1px solid var(--rule)}
.empty{margin:8px 0 0;color:var(--ink-2)}
.slip,.stub,.xcard,.goal{position:relative;padding:14px 4px 14px 16px;color:var(--ink)}
.slip::before,.stub::before,.xcard::before,.goal::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:2px;background:var(--edge-c)}
.slip{--edge-c:var(--pay)}.stub{--edge-c:var(--st,var(--part))}.xcard{--edge-c:var(--short)}.goal{--edge-c:var(--keep)}
.slip.focus,.stub.focus{border-radius:10px;background:var(--lnk)}
.slip.skipped{opacity:.75}
.hit{display:block;width:100%;padding:0;border:0;background:none;color:inherit;text-align:left}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.hd .nm,.hd .amt{font:600 18px/1.35 var(--sans)}
.amt{white-space:nowrap}
.hd .amt .hl{font:inherit;padding:0 6px}
.xcard .amt{color:var(--short)}
.dt{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
.lines{list-style:none;margin:6px 0 0;padding:0}
.lines li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px dashed var(--rule-2);font-size:14.5px}
.lines li>span{white-space:nowrap}
.lines small{color:var(--ink-2)}
.xline>span{color:var(--short)}
.keepline>span{color:var(--keep);font-weight:600}
.lk{display:inline;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;text-decoration:underline dotted;text-decoration-color:var(--ink-2);text-underline-offset:3px}
.leftbox{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px}
.leftbox .lbl{font:500 13.5px/1.3 var(--sans);color:var(--ink-2)}
.leftbox .big mark{padding:1px 8px;border-radius:6px;font:600 17px/1.4 var(--sans)}
.hl-yellow{background:var(--spend);color:var(--spend-ink);box-shadow:none}
.leftbox .per{flex-basis:100%;font-size:13.5px;color:var(--ink-2)}
.note{margin:8px 0 0;font-size:14px;color:var(--ink-2)}
.sttrow{display:flex;align-items:center;gap:8px;margin-top:9px}
.sttrow .hl{padding:2px 8px;font:600 13px/1.4 var(--sans)}
.paidfrom{margin:8px 0 0;font-size:14.5px}
.paidfrom .lk{font-weight:600}
.stub.st-paid .hd .nm,.stub.st-paid .hd .amt{text-decoration:line-through;color:var(--ink-2)}

/* summary */
.sumpage,.savepage{display:block}
.story{padding:22px 18px 20px;background:var(--today-bg);color:var(--today-ink)}
.say{margin:0;font:400 19px/1.6 var(--sans)}
.say.small{font-size:17px}
.story .big,.untouched .big{font:600 30px/1.15 var(--sans);letter-spacing:-.01em;white-space:nowrap}
.keep{margin:14px 0 0;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--today-ink) 25%,transparent);font-size:16.5px;color:color-mix(in srgb,var(--today-ink) 86%,transparent)}
.keep b{font-weight:600;color:var(--today-ink)}
.warnline{margin:14px 0 0;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--today-ink) 15%,transparent);font-size:15px}
.mrows{margin:0}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--rule)}
.mrow:first-child{border-top:0}
.mrow dt{font-size:17px}
.mrow dd{margin:0;font:600 22px/1.2 var(--sans);white-space:nowrap}
.mrow dd.in{color:var(--pay)}
.mrow dd.kept{color:var(--keep)}
.planrest{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--short-bg)}
.planrest p{margin:0;color:var(--short);font-weight:600;font-size:15px}
.rowsec{padding:0}
.rowlink{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:58px;padding:14px 16px;border:0;background:none;color:var(--ink);font:600 16.5px/1.3 var(--sans);text-align:left}
.rowlink::after{content:"›";font-size:26px;line-height:1;color:var(--accent)}
.wlabel{display:flex;align-items:center;gap:10px;margin:-16px -16px 6px;padding:11px 16px;border-bottom:1px solid var(--rule);background:var(--page-2);font:600 13px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--strip-ink)}
.week.now .wlabel{color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.wrows{list-style:none;margin:0;padding:0}
.wrow{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:baseline;width:100%;padding:11px 0;border:0;border-top:1px solid var(--rule);background:none;color:var(--ink);text-align:left}
.wrows li:first-child .wrow{border-top:0}
.wd{font:500 13.5px/1.3 var(--sans);color:var(--ink-2)}
.wn{min-width:0;font-size:17px;font-weight:500;line-height:1.35}
.wn small{display:block;margin-top:2px;font-size:14px;font-weight:400;color:var(--ink-2)}
.wa{font:600 17px/1.35 var(--sans);white-space:nowrap;text-align:right}
.wa.in{color:var(--pay)}
.wa.kept{color:var(--keep)}
.wrow.st-short small{color:var(--short);font-weight:600}
.wrow.st-partial small{color:var(--part-ink);font-weight:600}
.wrow.st-paid .wa,.wrow.skipped .wn,.wrow.st-skip .wa{color:var(--ink-2)}
.wsafe{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px;padding-top:10px;border-top:1px solid var(--rule-2)}
.wsafe span{font-weight:600}
.wsafe b{font:600 19px/1.2 var(--sans)}
.wsafe b.neg{color:var(--short)}
.quiet{margin:6px 0 0;font-size:14px;color:var(--ink-2)}

/* savings plan */
.subhead{display:flex;align-items:center;gap:12px;padding:12px 16px}
.subhead h2{margin:0;font:600 18px/1.2 var(--sans)}
.back svg{width:16px;height:16px}
.ulbl{margin:0;font:600 13px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--month-ink)}
.untouched .big{display:block;margin:4px 0 6px;color:var(--keep)}
.untouched .mrow{padding:8px 0}
.untouched .mrow dt,.untouched .mrow dd{font-size:16px}
.goals{padding-top:2px;padding-bottom:2px}
.goals .goal + .goal{border-top:1px solid var(--rule)}
.gtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.gtop h3{margin:0;font:600 18px/1.3 var(--sans)}
.gamt{font:600 17px/1.3 var(--sans);white-space:nowrap}
.gamt span{font-weight:400;color:var(--ink-2)}
.gbar{height:10px;margin:10px 0;border-radius:5px;background:var(--rule);overflow:hidden}
.gbar i{display:block;height:100%;min-width:4px;border-radius:5px;background:var(--keep)}
.gfoot{display:flex}
.gplan{margin-top:10px;padding-top:10px;border-top:1px dashed var(--rule-2);font-size:15px}
.gplan p{margin:0 0 6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border:1px solid var(--btn-edge);border-radius:10px;background:var(--btn);color:var(--btn-ink);font:600 15px/1.2 var(--sans);box-shadow:0 1px 0 var(--btn-edge)}
.btn.sm{min-height:38px;padding:0 12px;border-radius:8px;font-size:14px}
.btn.big{min-height:54px;font-size:17px}
.btn.solid{border-color:var(--btn2);background:var(--btn2);color:var(--btn2-ink);box-shadow:none}
.btn.go{border-color:var(--pay);background:var(--pay);color:var(--go-ink);box-shadow:none}
.btn.warn{border-color:var(--short);color:var(--short)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.linkbtn{padding:0;border:0;background:none;color:inherit;font-weight:600;text-decoration:underline}
.iconbtn{display:grid;place-items:center;flex:none;width:40px;height:40px;border:1px solid var(--btn-edge);border-radius:8px;background:var(--btn);color:var(--btn-ink)}
.iconbtn svg{width:18px;height:18px}
.lblrow{display:inline-flex;align-items:center;gap:6px}
.ib{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;margin-left:2px;padding:0;border:1.5px solid currentColor;border-radius:50%;background:transparent;color:var(--ink-2);font:italic 600 13px/1 Georgia,serif;vertical-align:middle}
.story .ib{color:inherit}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:6px;height:56px;padding:0 20px 0 14px;border:0;border-radius:28px;background:var(--btn2);color:var(--btn2-ink);font:600 16px/1 var(--sans);box-shadow:0 12px 24px -8px color-mix(in srgb,var(--accent) 70%,rgba(0,0,0,.5))}
.fab svg{width:24px;height:24px}
.fablbl{white-space:nowrap}

/* slim notice strips */
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 16px;background:var(--accent-bg);color:var(--ink);font-size:14.5px}
.banner>span{flex:1 1 200px}
.banner.warnb{background:var(--short-bg)}
.banner .btn{min-height:36px}

/* windows that slide up */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;padding:0 16px;border-top:4px solid var(--accent);border-radius:18px 18px 0 0;background:var(--paper);color:var(--ink);box-shadow:0 -10px 30px var(--shadow)}
.sheet::after{content:"";display:block;height:calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.has-save::after{display:none}
.sheet.enter{animation:sheetup .22s ease-out}
@keyframes sheetup{from{transform:translateY(28px);opacity:.6}}
.sh-head{position:sticky;top:0;z-index:3;margin:0 -16px;padding:0 16px;background:var(--paper)}
.winbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px;border-bottom:1px solid var(--rule)}
#sheet-title{margin:0;font:600 19px/1.25 var(--sans);outline:none}
.winbtn{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--btn-edge);border-radius:10px;background:var(--btn);color:var(--btn-ink)}
.winbtn svg{width:18px;height:18px}
.sheet .sub{margin:12px 0 0;color:var(--ink-2)}
.sheet .banner{margin:12px -16px 0;padding:10px 16px}
.sub-h{margin:20px 0 8px;font:600 13px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--month-ink)}
.subrow{display:flex;align-items:center;gap:6px;margin-top:20px}
.subrow .sub-h{margin:0}
.para{margin:12px 0 0;font-size:15px}
.para.warn{color:var(--short)}
.help{margin:8px 0 0;font-size:14px;color:var(--ink-2)}
.err{min-height:1em;margin:10px 0 0;color:var(--short);font-weight:600}
.field{display:grid;gap:6px;min-width:0;margin:16px 0;padding:0;border:0}
.field>label:not(.check),.lblrow>label,.flbl,.field legend{padding:0;font:600 14px/1.3 var(--sans);color:var(--ink-2)}
.field .lblrow{min-height:26px}
.inp{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--rule-2);border-radius:10px;background:var(--field);color:var(--ink);font-size:16px}
textarea.inp{min-height:auto}
select.inp{appearance:auto}
.money-in,.pct-in{position:relative;display:block}
.money-in::before{content:"$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none}
.money-in .inp{padding-left:26px}
.pct-in::after{content:"%";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none}
.pct-in .inp{padding-right:32px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>.field{margin:16px 0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.check{display:flex;align-items:center;gap:10px;min-height:42px;font-size:15.5px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.sheet-foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--rule)}
.tally{margin:16px 0 0;padding:12px 14px;border:1px solid var(--rule);border-left:5px solid var(--st,var(--plan));border-radius:10px;background:var(--paper-2);font-size:15px}
.tally b{display:block;font-size:16.5px}
.tally span{display:block;margin-top:3px;color:var(--ink-2)}
.tally.st-money{--st:var(--accent)}
.picks{list-style:none;margin:8px 0 0;padding:0}
.pick,.defs li.drow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;grid-template-areas:"w w x" "d m x";row-gap:2px;align-items:start;border-bottom:1px solid var(--rule)}
.pick{padding:10px 0 10px 10px;border-left:4px solid transparent}
.pick.on{border-left-color:var(--pay)}
.pick.xp{border-left-color:var(--short)}
.drow>.hw{grid-area:w;font:500 12px/1.4 var(--sans);color:var(--ink-2);white-space:nowrap}
.drow>.hdt{grid-area:d;padding-right:10px;font-weight:600;white-space:nowrap}
.drow>.hm{grid-area:m;min-width:0}
.drow>.hx{grid-area:x;align-self:center;padding-left:10px}
.pick .hdt,.pick .pi b{font-size:15.5px;line-height:21px}
.pi{display:grid;gap:1px}
.pi small{font-size:13.5px;color:var(--ink-2)}
.pi small.bad,.rowinfo.bad{color:var(--short);font-weight:600}
.ctl{display:flex;align-items:center;gap:6px}
.ctl .money-in{width:104px}
.amtbox{display:flex;align-items:center;text-align:left}
.defs{list-style:none;margin:0;padding:0}
.defs li.drow{padding:10px 0}
.defs .hd{display:flex;justify-content:space-between;gap:10px;padding:0;border:0}
.defs .hdt,.defs .hd b,.defs .hd .amt{font-size:16px;font-weight:600}
.defs small{display:block;font-size:13.5px;color:var(--ink-2)}
.savebar{position:sticky;bottom:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule-2);background:var(--paper);box-shadow:0 -8px 16px -12px var(--shadow)}
.savestate{font-size:14px;color:var(--ink-2)}
.savebar.dirty .savestate{color:var(--short);font-weight:600}
.savebar .btn{min-width:130px}
.confirmbar{margin-top:16px;padding:12px;border:1px solid var(--short);border-radius:10px;background:var(--short-bg)}
.confirmbar>span{font-weight:600}
.menulist{display:grid;gap:8px;margin-top:14px}
.menuitem{position:relative;display:grid;gap:2px;width:100%;padding:12px 40px 12px 14px;border:1px solid var(--btn-edge);border-radius:12px;background:var(--btn);color:var(--btn-ink);text-align:left}
.menuitem span{font-weight:600}
.menuitem small{font-size:13.5px;color:var(--ink-2)}
.menuitem::after{content:"›";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:24px;line-height:1;color:var(--ink-2)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--paper-2)}
.setblock{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--paper-2)}
.setblock .seg{margin-top:10px}
.setlbl{display:block;font-weight:600}
.setrow .help,.setblock .help{display:block;margin:2px 0 0}
.swwrap{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.switch{position:relative;flex:none;width:54px;height:32px;padding:0;border:0;border-radius:16px;background:var(--rule-2)}
.switch span{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] span{transform:translateX(22px)}
.logbook{margin-top:6px}
.lg-day{margin:18px 0 4px;font:600 13px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.lg-list{list-style:none;margin:0;padding:0}
.lg-list li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.lg-time{font:500 13px/1.3 var(--sans);color:var(--ink-2)}
.lg-amt{font-weight:600;white-space:nowrap}
.lg-amt.pos{color:var(--pay)}.lg-amt.neg{color:var(--short)}
.about p{margin:14px 0 0;font-size:15.5px;line-height:1.6}
.about p.fine{font-size:14px;color:var(--ink-2)}
.exrow .check{align-items:flex-start;min-height:0;gap:12px}
.exrow .check input{flex:none;margin-top:3px}
.exrow .check b{display:block;font-size:16px}
.exrow .check small{display:block;margin-top:2px;font-size:13.5px;color:var(--ink-2)}
.startsec h2{margin:0;font:600 21px/1.3 var(--sans)}
.startsec .para{color:var(--ink-2)}
.helpsteps{margin:14px 0 0;padding-left:22px}
.helpsteps li{margin:10px 0;font-size:15.5px;line-height:1.5}
.helpsteps li.done{color:var(--ink-2);text-decoration:line-through}
.tips{margin:0;padding-left:20px}
.tips li{margin:8px 0;font-size:15px;line-height:1.5}
.nearfield .lblrow{min-height:44px}
.nearbtn[aria-pressed="true"]{border-color:var(--pay);background:var(--pay-bg);color:var(--ink)}
.nearbtn[aria-pressed="true"]::before{content:"✓";font-weight:700}
.nearinfo{margin-top:8px;padding:10px 12px;border:1px solid var(--rule);border-left:4px solid var(--keep);border-radius:8px;background:var(--paper-2)}
.nearinfo .nlbl{display:block;font:600 13px/1.3 var(--sans);color:var(--ink-2)}
.nearinfo .help{margin-top:4px}
.nrow{display:grid;grid-template-columns:62px minmax(0,1fr);grid-template-areas:"w w" "d m";margin:6px 0 4px}
.nearinfo .hdt,.nearinfo .pi b{font-size:15.5px;line-height:21px}

/* the Add list */
.adddate{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 14px;margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:var(--page-2);box-shadow:inset 4px 0 0 var(--accent)}
.adddate .lbl{display:block;font:600 12.5px/1.3 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--strip-ink)}
.adddate b{display:block;margin-top:2px;font:600 19px/1.3 var(--sans);color:var(--ink)}
.dchange{display:grid;gap:4px;font:600 12.5px/1.3 var(--sans);color:var(--ink-2)}
.dchange .inp{width:auto;min-height:40px;padding:6px 10px;font-size:15px}
.addlist{display:grid;gap:8px;margin-top:12px}
.additem{display:grid;grid-template-columns:44px minmax(0,1fr) 16px;align-items:center;gap:12px;width:100%;padding:12px;border:1px solid var(--btn-edge);border-radius:12px;background:var(--btn);color:var(--btn-ink);text-align:left}
.additem::after{content:"›";font-size:24px;line-height:1;color:var(--ink-2)}
.addic{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--ic-bg);color:var(--ic)}
.addic svg{width:22px;height:22px}
.addtx b{display:block;font-size:16px}
.addtx small{display:block;margin-top:1px;font-size:13.5px;color:var(--ink-2)}
.a-in{--ic:var(--pay);--ic-bg:var(--pay-bg)}
.a-bill{--ic:var(--part-ink);--ic-bg:var(--part-bg)}
.a-sub{--ic:var(--plan);--ic-bg:var(--plan-bg)}
.a-ex{--ic:var(--short);--ic-bg:var(--short-bg)}
.a-goal{--ic:var(--keep);--ic-bg:var(--keep-bg)}

/* color way swatches in the menu */
.cwgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.cw{display:grid;justify-items:center;gap:6px;min-width:0;padding:10px 2px 8px;border:1px solid var(--rule);border-radius:12px;background:var(--paper);color:var(--ink);font-size:12.5px;font-weight:500}
.cw i{width:44px;height:40px;border:1px solid rgba(0,0,0,.14);border-radius:10px;background:linear-gradient(var(--cw-a) 0 38%,var(--cw-b) 38% 70%,var(--cw-c) 70%)}
.cw[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);font-weight:700}
.cw small{margin-top:-4px;font-size:11.5px;font-weight:500;color:var(--ink-2)}

/* hint bubble and toast */
.tip{position:fixed;z-index:70;padding:12px 42px 12px 14px;border-radius:10px;background:var(--chrome);color:var(--chrome-ink);font-size:14.5px;line-height:1.45;box-shadow:0 12px 28px var(--shadow)}
.tip p{margin:0}
.tip::before{content:"";position:absolute;top:-7px;left:var(--ax,50%);width:14px;height:14px;margin-left:-7px;background:inherit;transform:rotate(45deg)}
.tip.above::before{top:auto;bottom:-7px}
.tipx{position:absolute;top:6px;right:6px;display:grid;place-items:center;width:32px;height:32px;border:0;background:none;color:inherit}
.tipx svg{width:16px;height:16px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:540px;margin:0 auto;padding:10px 12px 10px 14px;border-radius:12px;background:var(--toast-bg);color:#FFFFFF;font-size:14.5px;line-height:1.35;box-shadow:0 12px 28px var(--shadow)}
.toast button{flex:none;min-height:36px;padding:2px 12px;border:1px solid currentColor;border-radius:8px;background:transparent;color:inherit;font-weight:600}
body.savebar-open #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* wider screens */
@media (min-width:760px){
  body{background:var(--desk)}
  .topbar{padding-left:24px;padding-right:24px}
  .topin{display:grid;grid-template-columns:1fr minmax(280px,360px) 1fr;align-items:center;gap:12px}
  .ftabs{grid-row:1;grid-column:2}
  .hbtns{grid-row:1;grid-column:3;justify-self:end}
  .folder{box-shadow:0 0 0 1px var(--rule)}
  .calpage{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);align-items:stretch}
  .calpage > .day{border-top:0;border-left:1px solid var(--rule)}
  .w3{display:inline}
  .tile{min-height:98px;padding:6px}
  .tile.sel{padding:5px}
  .t-compact{display:none}
  .t-chips{display:flex;flex-direction:column;gap:3px;width:100%;min-width:0}
  .chip{display:flex;justify-content:space-between;gap:4px;min-width:0;padding:2px 5px;border-radius:4px;background:var(--st-bg);box-shadow:inset 3px 0 0 var(--st);font-size:11.5px;line-height:1.35}
  .chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip .am{white-space:nowrap}
  .chip.more{background:none;box-shadow:none;color:var(--ink-2)}
  .t-av{position:absolute;top:6px;right:7px;margin:0;font-size:11px}
  .sheet{left:50%;right:auto;top:6vh;bottom:auto;width:min(560px,94vw);max-height:88vh;transform:translateX(-50%);border-radius:16px}
  .sheet.enter{animation:sheetpop .18s ease-out}
  .toast{bottom:28px}
  body.savebar-open #toast{bottom:28px}
}
@keyframes sheetpop{from{opacity:0;transform:translate(-50%,10px)}}
@media (prefers-reduced-motion:reduce){
  .sheet.enter{animation:none}
  .switch span{transition:none}
}

</style>

<body>
<div id="app">
  <header class="topbar" id="topbar">
    <div class="topin">
      <div class="ftabs" role="tablist" aria-label="Pages">
        <button type="button" class="ftab" role="tab" id="tab-sum" data-act="tab" data-tab="sum" aria-controls="pane-sum" aria-selected="true">Summary</button>
        <button type="button" class="ftab" role="tab" id="tab-cal" data-act="tab" data-tab="cal" aria-controls="pane-cal" aria-selected="false" tabindex="-1">Calendar</button>
      </div>
      <div class="hbtns">
        <button type="button" class="hbtn" data-act="open-help" aria-label="Getting started"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 9.2a3 3 0 1 1 4.3 2.7c-.8.4-1.3 1-1.3 1.9v.4M12 17.6v.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
        <button type="button" class="hbtn menubtn" data-act="settings" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </header>
  <div class="folder" id="folder">
    <main id="view" class="pager">
      <div class="track" id="track">
        <section class="pane" id="pane-sum" role="tabpanel" aria-labelledby="tab-sum"></section>
        <section class="pane off" id="pane-cal" role="tabpanel" aria-labelledby="tab-cal" inert aria-hidden="true"></section>
      </div>
    </main>
  </div>
  <button type="button" class="fab" id="fab" data-act="add-menu" aria-label="Add"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span class="fablbl"></span></button>
</div>
<div id="sheets"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="tip" class="tip" hidden><p id="tiptext" role="status" aria-live="polite"></p><button type="button" class="tipx" data-act="tip-close" aria-label="Close hint"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
<script>
(function () {
  'use strict';

  /* ---------------- helpers ---------------- */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const cssEsc = v => (window.CSS && CSS.escape) ? CSS.escape(v) : String(v).replace(/["\\[\]]/g, '\\$&');
  const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  const plural = (n, one, many) => (n === 1 ? one : (many || one + 's'));
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  /* ---------------- dates (YYYY-MM-DD strings, UTC math) ---------------- */
  const DAY = 864e5;
  const pad = n => String(n).padStart(2, '0');
  const ymd = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);
  const parts = ds => { const a = ds.split('-'); return { y: +a[0], m: +a[1], d: +a[2] }; };
  const toT = ds => { const p = parts(ds); return Date.UTC(p.y, p.m - 1, p.d); };
  const fromT = t => { const x = new Date(t); return ymd(x.getUTCFullYear(), x.getUTCMonth() + 1, x.getUTCDate()); };
  const addDays = (ds, n) => fromT(toT(ds) + n * DAY);
  const diffDays = (a, b) => Math.round((toT(b) - toT(a)) / DAY);
  const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  const dow = ds => new Date(toT(ds)).getUTCDay();
  const todayStr = () => { const n = new Date(); return ymd(n.getFullYear(), n.getMonth() + 1, n.getDate()); };
  const ym = ds => ds.slice(0, 7);
  const shiftMonth = (k, n) => { let y = +k.slice(0, 4), m = +k.slice(5, 7) + n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + pad(m); };
  const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && fromT(toT(s)) === s;
  const fmt = (ds, o) => new Date(toT(ds)).toLocaleDateString('en-US', Object.assign({ timeZone: 'UTC' }, o));
  const dShort = ds => fmt(ds, { month: 'short', day: 'numeric' });
  const dMed = ds => fmt(ds, { weekday: 'short', month: 'short', day: 'numeric' });
  const dLong = ds => fmt(ds, { weekday: 'long', month: 'long', day: 'numeric' });
  const ordinal = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
  const monthRange = k => { const y = +k.slice(0, 4), m = +k.slice(5, 7); return [ymd(y, m, 1), ymd(y, m, dim(y, m))]; };
  const byDate = (a, b) => (a.ds < b.ds ? -1 : a.ds > b.ds ? 1 : 0);

  /* ---------------- money (integer cents) ---------------- */
  const USD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
  const money = c => USD.format((c || 0) / 100);
  const parseMoney = v => {
    if (v == null) return null;
    const s = String(v).replace(/[^0-9.]/g, '');
    if (!s || s === '.') return null;
    const n = Math.round(parseFloat(s) * 100);
    return Number.isFinite(n) && n >= 0 ? n : null;
  };
  const compact = c => { const d = Math.round(Math.abs(c) / 100); return d >= 10000 ? (Math.round(d / 100) / 10) + 'k' : d.toLocaleString('en-US'); };
  const tiny = c => { const d = Math.round(Math.abs(c) / 100); return d >= 1000 ? (Math.round(d / 100) / 10) + 'k' : String(d); };
  const toInput = c => (c / 100).toFixed(2);

  /* ---------------- icons ---------------- */
  const svg = (d, extra) => '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="' + d + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' + (extra || '') + '/></svg>';
  const ICON_X = svg('M6 6l12 12M18 6L6 18');
  const ICON_EDIT = svg('M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4');
  const ib = (tip, label) => S.prefs.hints ? '<button type="button" class="ib" data-act="tip" data-tip="' + esc(tip) + '" aria-label="' + esc(label) + '" aria-expanded="false" aria-controls="tip"><span aria-hidden="true">i</span></button>' : '';

  /* ---------------- state ---------------- */
  const FREQ_IN = ['weekly', 'biweekly', 'semimonthly', 'monthly', 'once'];
  const FREQ_BILL = ['monthly', 'biweekly', 'weekly', 'yearly', 'once'];
  // Kinds of money coming in. The kind is what "Paid from" and the summary call it.
  const KINDS = { paycheck: 'Paycheck', deposit: 'Direct deposit', gig: 'Side gig', gift: 'Gift', other: 'Other' };
  const guessKind = n => (/direct\s*dep/i.test(n) ? 'deposit' : /gig|side/i.test(n) ? 'gig' : /gift/i.test(n) ? 'gift' : /pay/i.test(n) ? 'paycheck' : 'other');
  const kindWord = src => (src.kind === 'other' || !KINDS[src.kind] ? src.name : KINDS[src.kind].toLowerCase());
  // Color ways for the one sleek look: id, name, header color, accent color (used for the menu swatches).
  // Themes: id, name, header color, accent, tint (menu previews), dark header color (phone top bar).
  const COLORWAYS = [['cobalt','Cobalt','#1D4ED8','#2563EB','#DBEAFE','#1E3A8A'], ['cherry','Cherry','#BE123C','#E11D48','#FFE4E6','#881337'], ['emerald','Emerald','#065F46','#047857','#D1FAE5','#064E3B'], ['bubblegum','Bubblegum','#F472B6','#BE185D','#FCE7F3','#831843'], ['sky','Sky','#7DD3FC','#0369A1','#E0F2FE','#0C4A6E'], ['tangerine','Tangerine','#C2410C','#C2410C','#FFEDD5','#7C2D12'], ['violet','Violet','#6D28D9','#7C3AED','#EDE9FE','#4C1D95'], ['lime','Lime','#4D7C0F','#4D7C0F','#ECFCCB','#365314'], ['lagoon','Lagoon','#155E75','#0E7490','#CFFAFE','#164E63'], ['honey','Honey','#FBBF24','#B45309','#FEF3C7','#78350F'], ['orchid','Orchid','#A21CAF','#A21CAF','#FAE8FF','#701A75'], ['cocoa','Cocoa','#58361F','#8F5E37','#F5ECE3','#432817']];
  const CW_IDS = COLORWAYS.map(c => c[0]);
  // Each month gets a theme clearly different from its neighbors (not tied to month moods).
  const MONTH_CW = ['cobalt', 'cherry', 'emerald', 'bubblegum', 'sky', 'tangerine', 'violet', 'lime', 'lagoon', 'honey', 'orchid', 'cocoa'];
  const MONTH_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const nextWord = src => ({ paycheck: 'paycheck', deposit: 'direct deposit', gig: 'side gig payment', gift: 'gift' })[src.kind] || 'deposit';
  const blank = () => ({ v: 1, sources: [], bills: [], checkEdits: {}, billEdits: {}, allocs: [], expenses: [], goals: [], log: [], prefs: { weekStart: 0, hints: true, cw: 'cobalt', cwMode: 'month', mode: 'auto' }, demo: false, updatedAt: 0 });
  let S = blank();
  let IDX = { byCheck: new Map(), byBill: new Map() };
  let GOALS = { byCheck: new Map(), byGoal: new Map() };
  const UI = { tab: 'sum', sub: '', month: ym(todayStr()), sel: todayStr(), focus: null, today: todayStr(), grid: null, openGoals: new Set(), scroll: { cal: 0, sum: 0 } };

  const hasData = s => s.sources.length > 0 || s.bills.length > 0;
  const clampDay = (v, dflt) => { const n = Math.round(Number(v)); return n >= 1 && n <= 31 ? n : dflt; };
  const splitKey = k => { const i = k.lastIndexOf('@'); return [k.slice(0, i), k.slice(i + 1)]; };

  function normalize(o) {
    if (!o || typeof o !== 'object' || Array.isArray(o)) return null;
    if (o.state && typeof o.state === 'object' && !Array.isArray(o.state)) o = o.state;
    if (!Array.isArray(o.sources) && !Array.isArray(o.bills)) return null;
    const s = blank();
    const cleanRule = (r, freqs) => {
      if (!r || typeof r !== 'object' || !isDate(r.start) || freqs.indexOf(r.freq) < 0) return null;
      const out = { id: String(r.id || uid()).replace(/[^a-z0-9]/gi, '') || uid(), name: String(r.name || '').trim().slice(0, 60) || 'Untitled', amount: Math.max(0, Math.round(Number(r.amount) || 0)), freq: r.freq, start: r.start };
      if (isDate(r.end) && r.freq !== 'once') out.end = r.end;
      if (r.freq === 'semimonthly') { out.day1 = clampDay(r.day1, parts(r.start).d); out.day2 = clampDay(r.day2, 15); }
      if (r.auto === true) out.auto = true;
      if (r.nearest === true) out.nearest = true;
      return out;
    };
    s.sources = (Array.isArray(o.sources) ? o.sources : []).map(r => {
      const out = cleanRule(r, FREQ_IN);
      if (!out) return null;
      out.kind = KINDS[r.kind] ? r.kind : guessKind(out.name);
      const lands = String(r.lands || '').trim().slice(0, 40);
      if (lands) out.lands = lands;
      return out;
    }).filter(Boolean);
    s.bills = (Array.isArray(o.bills) ? o.bills : []).map(r => cleanRule(r, FREQ_BILL)).filter(Boolean);
    const cleanEdits = e => {
      const out = {};
      if (e && typeof e === 'object') {
        for (const k of Object.keys(e)) {
          const v = e[k];
          if (!/^[a-z0-9]+@\d{4}-\d{2}-\d{2}$/i.test(k) || !v || typeof v !== 'object') continue;
          const x = {};
          if (Number.isFinite(v.amount)) x.amount = Math.max(0, Math.round(v.amount));
          if (v.skip) x.skip = true;
          if (v.paid === true) x.paid = true; else if (v.paid === false) x.paid = false;
          if (v.manual) x.manual = true;
          if (Object.keys(x).length) out[k] = x;
        }
      }
      return out;
    };
    s.checkEdits = cleanEdits(o.checkEdits);
    s.billEdits = cleanEdits(o.billEdits);
    s.allocs = (Array.isArray(o.allocs) ? o.allocs : [])
      .filter(a => a && typeof a.bill === 'string' && typeof a.check === 'string' && Number.isFinite(a.amount))
      .map(a => ({ bill: a.bill, check: a.check, amount: Math.max(0, Math.round(a.amount)) }));
    s.expenses = (Array.isArray(o.expenses) ? o.expenses : [])
      .filter(x => x && isDate(x.ds) && Number.isFinite(x.amount))
      .map(x => ({ id: String(x.id || uid()).replace(/[^a-z0-9]/gi, '') || uid(), name: String(x.name || '').trim().slice(0, 60) || 'Unexpected expense', amount: Math.max(0, Math.round(x.amount)), ds: x.ds, check: typeof x.check === 'string' && /^[a-z0-9]+@\d{4}-\d{2}-\d{2}$/i.test(x.check) ? x.check : null }));
    s.goals = (Array.isArray(o.goals) ? o.goals : []).map(g => {
      if (!g || typeof g !== 'object') return null;
      const target = Math.round(Number(g.target)), method = ['date', 'amount', 'percent'].indexOf(g.method) >= 0 ? g.method : null;
      if (!(target > 0) || !method) return null;
      const out = { id: String(g.id || uid()).replace(/[^a-z0-9]/gi, '') || uid(), name: String(g.name || '').trim().slice(0, 60) || 'Savings goal', target, method, start: isDate(g.start) ? g.start : todayStr() };
      if (method === 'date') { if (!isDate(g.date)) return null; out.date = g.date; }
      if (method === 'amount') { const a = Math.round(Number(g.amount)); if (!(a > 0)) return null; out.amount = a; }
      if (method === 'percent') { const pc = Number(g.percent); if (!(pc > 0 && pc <= 100)) return null; out.percent = Math.round(pc * 100) / 100; }
      out.from = Array.isArray(g.from) && g.from.length ? g.from.filter(x => typeof x === 'string').slice(0, 50) : 'all';
      return out;
    }).filter(Boolean);
    s.log = (Array.isArray(o.log) ? o.log : [])
      .filter(x => x && Number.isFinite(x.t) && typeof x.msg === 'string')
      .slice(-400)
      .map(x => { const e = { t: x.t, msg: x.msg.slice(0, 300) }; if (Number.isFinite(x.amt)) e.amt = Math.round(x.amt); return e; });
    s.prefs.weekStart = 0; // pay weeks always run Sunday to Saturday
    s.prefs.hints = !(o.prefs && o.prefs.hints === false);
    s.prefs.cw = o.prefs && CW_IDS.indexOf(o.prefs.cw) >= 0 ? o.prefs.cw : 'cobalt';
    s.prefs.cwMode = o.prefs && o.prefs.cwMode === 'fixed' ? 'fixed' : 'month';
    s.prefs.mode = o.prefs && ['light', 'dark'].indexOf(o.prefs.mode) >= 0 ? o.prefs.mode : 'auto';
    s.demo = !!o.demo;
    s.updatedAt = Number(o.updatedAt) || 0;
    return s;
  }

  /* ---------------- schedules ---------------- */
  function occurs(r, ds) {
    if (ds < r.start || (r.end && ds > r.end)) return false;
    const p = parts(ds), s = parts(r.start), last = dim(p.y, p.m);
    switch (r.freq) {
      case 'once': return ds === r.start;
      case 'weekly': return diffDays(r.start, ds) % 7 === 0;
      case 'biweekly': return diffDays(r.start, ds) % 14 === 0;
      case 'monthly': return p.d === Math.min(s.d, last);
      case 'yearly': return p.m === s.m && p.d === Math.min(s.d, last);
      case 'semimonthly': return p.d === Math.min(r.day1 || s.d, last) || p.d === Math.min(r.day2 || 15, last);
    }
    return false;
  }
  function makeCheck(src, ds) {
    const key = src.id + '@' + ds, e = S.checkEdits[key] || {};
    return { kind: 'check', key, ds, src, name: src.name, amount: e.amount != null ? e.amount : src.amount, base: src.amount, edited: e.amount != null, skip: !!e.skip };
  }
  function makeBill(def, ds) {
    const key = def.id + '@' + ds, e = S.billEdits[key] || {};
    const autoPaid = !!def.auto && e.paid == null && ds <= todayStr();

  }
  function goalNote(g) {
    const s = goalStats(g), t = todayStr(), pct = Math.max(0, Math.min(100, Math.round(s.saved / g.target * 100))), open = UI.openGoals.has(g.id);
    const how = g.method === 'date' ? 'By ' + dMed(g.date) + (s.next.length ? ': about ' + money(s.next[0].amount) + ' from each deposit' : '') : g.method === 'amount' ? money(g.amount) + ' from every deposit' : g.percent + '% of every deposit';
    const accts = Array.from(new Set(s.rows.map(x => x.src.lands).filter(Boolean)));
    const nextTxt = s.next.length ? 'Next: ' + listJoin(s.next.slice(0, 3).map(x => dShort(x.ds) + ' (' + money(x.amount) + ')')) : s.saved >= g.target ? 'Done. The whole amount is set aside.' : 'No more deposits planned for it.';
    const reachTxt = s.reach ? 'Reached ' + (s.reach <= t ? '' : g.method === 'date' ? 'by ' : 'around ') + dMed(s.reach) : g.method === 'date' ? 'Falls short by ' + money(g.target - s.planned) + ' by ' + dMed(g.date) : 'Not reached with the deposits in the planner so far';
    return '<article class="goal"><div class="gtop"><h3>' + esc(g.name) + '</h3><span class="gamt">' + money(s.saved) + ' <span>of ' + money(g.target) + '</span></span></div>' +
      '<div class="gbar" role="progressbar" aria-label="' + esc(g.name) + ' progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
      '<div class="gfoot"><button type="button" class="btn sm" data-act="toggle-plan" data-id="' + g.id + '" aria-expanded="' + open + '" aria-controls="gp-' + g.id + '">' + (open ? 'Hide plan' : 'View plan') + '</button></div>' +
      '<div class="gplan" id="gp-' + g.id + '"' + (open ? '' : ' hidden') + '><p>' + esc(how) + '</p><p>' + esc(nextTxt) + '</p><p>' + esc(reachTxt) + '</p>' +
      '<p>Stays in ' + esc(accts.length ? listJoin(accts) : 'the account each deposit lands in') + '</p>' +
      '<div class="actions"><button type="button" class="btn sm" data-act="edit-goal" data-id="' + g.id + '">Edit goal</button></div></div></article>';
  }

  function tile(ds, d, f) {
    const inSum = d.c.reduce((t, c) => t + c.amount, 0);
    const over = d.c.some(c => checkLeft(c) < 0);
    const billSum = d.b.reduce((t, b) => t + b.amount, 0), exSum = d.x.reduce((t, x) => t + x.amount, 0);
    const sts = d.b.map(status);
    const worst = ['short', 'partial', 'planned', 'paid'].find(s => sts.indexOf(s) >= 0);
    const cls = ['tile', f.out && 'out', f.today && 'today', f.past && 'past', f.sel && 'sel', f.linked && 'linked'].filter(Boolean).join(' ');
    const lab = [dLong(ds)];
    if (f.av != null) lab.push('about ' + signedMoney(Math.floor(f.av)) + ' to spend');
    if (d.c.length) lab.push('money coming in ' + money(inSum));
    if (d.b.length) lab.push(d.b.length + ' ' + plural(d.b.length, 'bill') + ' due, ' + d.b.map((b, i) => b.name + ' ' + money(b.amount) + ' ' + statusText(b, sts[i])).join(', '));
    if (d.x.length) lab.push('unexpected expenses ' + money(exSum));
    if (f.linked) lab.push('linked to your selection');
    const chips = d.c.map(c => '<span class="chip inc"><span class="nm">' + esc(c.name) + '</span><span class="am">+' + compact(c.amount) + '</span></span>')
      .concat(d.b.map((b, i) => '<span class="chip st-' + sts[i] + '"><span class="nm">' + esc(b.name) + '</span><span class="am">' + compact(b.amount) + '</span></span>'))
      .concat(d.x.map(x => '<span class="chip ex"><span class="nm">' + esc(x.name) + '</span><span class="am">−' + compact(x.amount) + '</span></span>'));
    const chipHtml = chips.length > 3 ? chips.slice(0, 2).join('') + '<span class="chip more">+' + (chips.length - 2) + ' more</span>' : chips.join('');
    return '<button type="button" class="' + cls + '" data-act="day" data-date="' + ds + '" aria-label="' + esc(lab.join('. ')) + '" aria-pressed="' + f.sel + '"' + (f.today ? ' aria-current="date"' : '') + '>' +
      '<span class="dn">' + parts(ds).d + '</span>' +
      '<span class="t-compact" aria-hidden="true">' +
      (d.c.length ? '<span class="hl t-in' + (over ? ' over' : '') + '">+' + tiny(inSum) + '</span>' : '') +
      (d.b.length ? '<span class="hl t-out st-' + worst + '">' + tiny(billSum) + '</span>' : '') +
      (d.x.length ? '<span class="hl t-ex">−' + tiny(exSum) + '</span>' : '') +
      '</span><span class="t-chips" aria-hidden="true">' + chipHtml + '</span>' +
      (f.av != null ? '<span class="t-av' + (f.av < 0 ? ' neg' : '') + '" aria-hidden="true">' + wholeDollars(f.av) + '</span>' : '') + '</button>';
  }

  function renderDay(ds) {
    const checks = checksIn(ds, ds, true), bills = billsIn(ds, ds, true), xs = S.expenses.filter(x => x.ds === ds);
    const per = periodOf(ds);
    let h = '<div class="dayhead"><h3 id="dayh"><span>' + dLong(ds) + '</span>' + (ds === todayStr() ? '<span class="tag">Today</span>' : '') + '</h3>';
    if (per) {
      const v = Math.floor(per.money / per.days);
      h += '<p class="dayavail"><span class="lbl">Available to spend</span><b class="' + (v < 0 ? 'neg' : '') + '">' + signedMoney(v) + '</b>' +
        ib('This day’s share of what’s left from the ' + dShort(per.start) + ' payday after its bills and unexpected expenses, spread evenly from ' + dShort(per.start) + ' to ' + dShort(per.end) + '.', 'About this amount') + '</p>';
    }
    h += '</div>';
    if (checks.length || bills.length || xs.length) h += '<div class="stack">' + checks.map(c => slipCard(c, { inCal: true })).join('') + bills.map(b => stubCard(b, { inCal: true })).join('') + xs.map(expenseCard).join('') + '</div>';
    else h += '<p class="empty">Nothing on this day yet. Tap the + button to add something.</p>';
    return h;
  }

  function leftBox(c, left, billsUsed, spent, keep) {
    keep = keep || 0;
    if (left < 0) return '<div class="leftbox"><span class="lbl">Over by</span>' + ib('Bills' + (spent ? ' and unexpected expenses' : '') + ' on this check add up to ' + money(billsUsed + spent + keep) + ', but the check is ' + money(c.amount) + '. Lower an amount or move a bill to another check.', 'What does Over by mean?') +
      '<span class="big"><mark class="hl st-short">' + money(-left) + '</mark></span><span class="per">More is assigned than this check brings in.</span></div>';
    const next = left > 0 ? nextPayday(c.ds) : null;
    const days = next ? Math.max(1, diffDays(c.ds, next)) : 0, perDay = next ? Math.floor(left / days) : 0;
    let leftTip = 'This check is ' + money(c.amount) + '.';
    if (billsUsed) leftTip += ' ' + money(billsUsed) + ' of it goes to bills.';
    if (spent) leftTip += ' ' + money(spent) + ' went to unexpected expenses.';
    if (keep) leftTip += ' ' + money(keep) + ' stays untouched for your savings goals.';

    return '<div class="leftbox"><span class="lbl">Safe to spend</span>' + ib(leftTip, 'What does Safe to spend mean?') + '<span class="big"><mark class="hl hl-yellow">' + money(left) + '</mark></span>' +
      (next ? '<span class="per">About ' + money(perDay) + ' a day until next payday on ' + dShort(next) + ' <span class="nw">(' + days + ' ' + plural(days, 'day') + ')' +
        ib(money(left) + ' left divided by the ' + days + ' ' + plural(days, 'day') + ' until your next payday on ' + dShort(next) + ' is about ' + money(perDay) + ' a day. Use it as a rough daily budget for gas, food and anything else the planner doesn’t track.', 'What does the daily amount mean?') + '</span></span>' : '') + '</div>';
  }

  function slipCard(c, opt) {
    opt = opt || {};
    const allocs = (IDX.byCheck.get(c.key) || []).slice().sort((a, b) => (splitKey(a.bill)[1] < splitKey(b.bill)[1] ? -1 : 1));
    const xs = expensesFrom(c.key);
    const billsUsed = allocs.reduce((t, a) => t + a.amount, 0), spent = xs.reduce((t, x) => t + x.amount, 0), keep = untouchedFrom(c.key), left = c.amount - billsUsed - spent - keep;
    const focused = !!(opt.inCal && UI.focus && UI.focus.type === 'check' && UI.focus.key === c.key);
    const lines = allocs.map(a => {
      const b = billByKey(a.bill);
      return b ? '<li><button type="button" class="lk" data-act="open-bill" data-key="' + esc(b.key) + '">' + esc(b.name) + ' <small>due ' + dShort(b.ds) + '</small></button><span>' + money(a.amount) + '</span></li>' : '';
    }).join('') + xs.map(x => '<li class="xline"><button type="button" class="lk" data-act="edit-expense" data-id="' + x.id + '">' + esc(x.name) + ' <small>unexpected, ' + dShort(x.ds) + '</small></button><span>−' + money(x.amount) + '</span></li>').join('') +
      (GOALS.byCheck.get(c.key) || []).map(x => '<li class="keepline"><button type="button" class="lk" data-act="open-savings">' + esc(x.goal.name) + ' <small>left untouched</small></button><span>' + money(x.amount) + '</span></li>').join('');
    const hitAttrs = opt.inCal ? 'data-act="focus" data-type="check" data-key="' + esc(c.key) + '" aria-pressed="' + focused + '"' : 'data-act="open-check" data-key="' + esc(c.key) + '"';
    let h = '<article class="slip' + (focused ? ' focus' : '') + (c.skip ? ' skipped' : '') + '">' +
      '<button type="button" class="hit' + (opt.inCal ? '' : ' drow') + '" ' + hitAttrs + '>' + (opt.inCal ? '' : dayParts(c.ds)) +
      '<span class="hm hd"><span class="nm">' + esc(c.name) + '</span><span class="amt">' + (c.skip ? 'Skipped' : '<span class="hl hl-green">+' + money(c.amount) + '</span>') + '</span></span></button>' +
      (c.edited && !c.skip ? '<p class="dt">Amount changed this time (usually ' + money(c.base) + ')</p>' : '');
    if (c.skip) h += '<p class="note">No pay this time.</p>';
    else {
      h += lines ? '<ul class="lines" aria-label="What this check pays for">' + lines + '</ul>' : '<p class="note">Not paying any bills yet.</p>';
      h += leftBox(c, left, billsUsed, spent, keep);
    }
    h += '<div class="actions"><button type="button" class="btn sm' + (c.skip ? '' : ' go') + '" data-act="open-check" data-key="' + esc(c.key) + '">' + (c.skip ? 'Open' : 'Choose bills to pay') + '</button></div></article>';
    return h;
  }

  function expenseCard(x) {
    const c = x.check ? checkByKey(x.check) : null;
    return '<article class="xcard"><div class="hd"><span class="nm">' + esc(x.name) + '</span><span class="amt">−' + money(x.amount) + '</span></div>' +
      '<p class="dt">Unexpected expense' + (c ? ', taken from ' + esc(checkWords(c)) : ', not tied to a deposit') + '</p>' +
      '<div class="actions"><button type="button" class="btn sm" data-act="edit-expense" data-id="' + x.id + '">Edit</button></div></article>';
  }

  function stubCard(b, opt) {
    opt = opt || {};
    const st = b.skip ? 'paid' : status(b), auto = !!b.def.auto;
    const allocs = (IDX.byBill.get(b.key) || []).slice().sort((x, y) => (splitKey(x.check)[1] < splitKey(y.check)[1] ? -1 : 1));
    const cov = allocs.reduce((t, a) => t + a.amount, 0);
    const focused = !!(opt.inCal && UI.focus && UI.focus.type === 'bill' && UI.focus.key === b.key);
    let stt, tipTxt;
    if (cov > b.amount) { stt = 'Covered, ' + money(cov - b.amount) + ' extra planned'; tipTxt = 'More is planned than this bill needs. Lower one of the amounts to free up ' + money(cov - b.amount) + '.'; }
    else if (cov === b.amount && auto) { stt = 'Automatic payment'; tipTxt = 'This one pays itself. Its money comes out of ' + (allocs.length === 1 ? 'the ' + dShort(splitKey(allocs[0].check)[1]) + ' paycheck' : 'your paychecks') + ', and it’s marked paid on its due date, so there’s nothing to tap.'; }
    else if (cov === b.amount) { stt = 'Money lined up'; tipTxt = 'Money is lined up for the whole bill, so it counts as paid on its due date. If it doesn’t go through, open it and mark it not paid.'; }
    else if (cov > 0) { stt = 'Short ' + money(b.amount - cov); tipTxt = 'Paychecks cover ' + money(cov) + ' of this ' + money(b.amount) + ' bill. ' + money(b.amount - cov) + ' still needs a check. Tap Plan payment to add one.'; }
    else { stt = 'No money assigned yet'; tipTxt = 'No paycheck money is assigned to this bill yet. Tap Plan payment to choose a check.'; }
    if (b.paid) tipTxt = (auto && b.autoPaid ? 'Paid automatically on its due date.' : b.assumed ? 'Counted as paid on its due date because its money was lined up. Tap Mark not paid if it didn’t go through.' : 'You marked this bill paid.') + (allocs.length ? ' The paychecks below show where the money came from.' : '');
    if (b.skip) tipTxt = 'Skipped this time, so it doesn’t count this month. Open it to bring it back.';
    const sttHtml = b.skip ? '<span class="stt skip">Skipped this time</span>' : b.paid ? '<span class="stt"><mark class="hl st-done">' + (auto && b.autoPaid ? 'Paid automatically' : b.assumed ? 'Paid as planned' : 'Paid') + '</mark></span>' : '<span class="stt"><mark class="hl st-' + st + '">' + stt + '</mark></span>';
    // Amounts only show when more than one check pays, or one check covers part of it.
    const showAmt = allocs.length > 1 || cov !== b.amount;
    const froms = allocs.map(a => { const c = checkByKey(a.check); return c ? '<button type="button" class="lk" data-act="goto" data-date="' + c.ds + '" data-type="check" data-key="' + esc(c.key) + '">' + esc(checkWords(c)) + '</button>' + (showAmt ? ' (' + money(a.amount) + ')' : '') : ''; }).filter(Boolean);
    const hitAttrs = opt.inCal ? 'data-act="focus" data-type="bill" data-key="' + esc(b.key) + '" aria-pressed="' + focused + '"' : 'data-act="open-bill" data-key="' + esc(b.key) + '"';
    const head = '<span class="hm hd"><span class="nm">' + esc(b.name) + '</span><span class="amt">' + money(b.amount) + '</span></span>';
    let h = '<article class="stub st-' + st + (focused ? ' focus' : '') + '">' +
      '<button type="button" class="hit' + (opt.inCal ? '' : ' drow') + '" ' + hitAttrs + '>' + (opt.inCal ? '' : dayParts(b.ds)) + head + '</button>' +
      (b.edited ? '<p class="dt">Amount changed this time (usually ' + money(b.base) + ')</p>' : '') +
      '<div class="sttrow">' + sttHtml + ib(tipTxt, 'What does this status mean?') + '</div>';
    if (froms.length) h += '<p class="paidfrom">Paid from ' + listJoin(froms) + ib(froms.length > 1 ? 'The paychecks this bill’s money comes from, and how much each one covers. Tap one to jump to that payday.' : 'The paycheck this bill’s money comes from. Tap it to jump to that payday.' + (showAmt ? ' The amount shows because this check covers only part of the bill.' : ''), 'What does Paid from mean?') + '</p>';
    if (!b.paid && !b.skip && b.ds < todayStr()) h += '<p class="note">This due date has passed. Mark it paid if it’s taken care of.</p>';
    h += '<div class="actions">';
    if (b.skip) h += '<button type="button" class="btn sm" data-act="open-bill" data-key="' + esc(b.key) + '">Open</button>';
    else {
      h += '<button type="button" class="btn sm' + (st === 'short' || st === 'partial' ? ' solid' : '') + '" data-act="open-bill" data-key="' + esc(b.key) + '">' + (st === 'short' || st === 'partial' ? 'Plan payment' : 'Change plan') + '</button>';
      if (!auto || b.paid || b.ds < todayStr()) h += '<button type="button" class="btn sm" data-act="toggle-paid" data-key="' + esc(b.key) + '" aria-pressed="' + b.paid + '">' + (b.paid ? (b.assumed || b.autoPaid ? 'Mark not paid' : 'Undo paid') : 'Mark paid') + '</button>';
    }
    return h + '</div></article>';
  }

  /* ---------------- sheets ---------------- */
  const sheetStack = [];
  let lastFocus = null;
  const topSheet = () => sheetStack[sheetStack.length - 1] || null;
  const sheetHead = (title, sub) => '<header class="sh-head"><div class="winbar"><h2 id="sheet-title" tabindex="-1">' + esc(title) + '</h2><button type="button" class="winbtn" data-act="close" aria-label="Close">' + ICON_X + '</button></div></header>' + (sub ? '<p class="sub">' + sub + '</p>' : '');
  const goneSheet = msg => sheetHead('Not on the calendar') + '<p>' + esc(msg) + '</p><div class="actions"><button type="button" class="btn" data-act="close">Close</button></div>';

  function openSheet(kind, params) {
    $('#toast').hidden = true;
    pendingUndo = null;
    if (!sheetStack.length) lastFocus = document.activeElement;
    sheetStack.push({ kind, params: params || {} });
    renderSheet(false, true);
  }
  function closeSheet() {
    hideTip();
    sheetStack.pop();
    if (sheetStack.length) { renderSheet(false); return; }
    $('#sheets').innerHTML = '';
    document.body.classList.remove('locked', 'savebar-open');
    $('#app').inert = false;
    if (lastFocus && lastFocus.isConnected) lastFocus.focus({ preventScroll: true });
    else { const sel = $('.tile.sel'); if (sel) sel.focus({ preventScroll: true }); }
    lastFocus = null;
  }
  // Closing a window with changes that aren't saved asks first.
  function requestClose() {
    const top = topSheet();
    if (top && top.params.dirty && !top.params.confirmClose) {
      top.params.confirmClose = true;
      $('#toast').hidden = true;
      renderSheet(true);
      const sh = $('#sheets .sheet');
      if (sh) sh.scrollTop = sh.scrollHeight;
      const b = $('#sheets .confirmbar .btn');
      if (b) b.focus({ preventScroll: true });
      return;
    }
    closeSheet();
  }
  function closeAllSheets() { if (!sheetStack.length) return; sheetStack.length = 1; closeSheet(); }
  function renderSheet(keep, animate, focusFid) {
    hideTip();
    const top = topSheet(), root = $('#sheets');
    if (!top) { root.innerHTML = ''; return; }
    const prev = root.querySelector('.sheet');
    const scroll = prev ? prev.scrollTop : 0;
    const ae = document.activeElement;
    const fid = focusFid || (keep && ae && prev && prev.contains(ae) && ae.dataset ? ae.dataset.fid : null);
    const body = SHEETS[top.kind](top.params);
    root.innerHTML = '<div class="scrim" data-act="close"></div><div class="sheet' + (animate ? ' enter' : '') + (body.indexOf('class="savebar') >= 0 ? ' has-save' : '') + '" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' + body + '</div>';
    document.body.classList.add('locked');
    document.body.classList.toggle('savebar-open', body.indexOf('class="savebar') >= 0);
    $('#app').inert = true;
    const sh = root.querySelector('.sheet');
    if (keep || focusFid) {
      sh.scrollTop = scroll;
      const el = fid ? sh.querySelector('[data-fid="' + cssEsc(fid) + '"]') : null;
      if (el) el.focus({ preventScroll: true });
    } else {
      const h = sh.querySelector('#sheet-title');
      if (h) h.focus({ preventScroll: true });
    }
  }

  /* drafts: plan edits stay in the window until you tap Save */
  function billDraft(p, b) {
    if (!p.draft) {
      const allocs = {};
      (IDX.byBill.get(b.key) || []).forEach(a => { allocs[a.check] = a.amount; });
      p.draft = { amount: b.amount, allocs };
      p.dirty = false;
    }
    return p.draft;
  }
  function checkDraft(p, c) {
    if (!p.draft) {
      const allocs = {};
      (IDX.byCheck.get(c.key) || []).forEach(a => { allocs[a.bill] = a.amount; });
      p.draft = { amount: c.amount, allocs };
      p.dirty = false;
    }
    return p.draft;
  }
  function billTally(b, dr) {
    const cov = sumDraft(dr), amt = dr.amount;
    if (b.skip) return { st: 'paid', html: '<b>Skipped this time.</b><span>Bring it back to plan a payment.</span>' };
    if (b.paid) return { st: 'paid', html: '<b>' + (b.def.auto && b.autoPaid ? 'Paid automatically on ' + dShort(b.ds) + '.' : 'Marked paid.') + '</b>' + (cov ? '<span>' + money(cov) + ' came from your paychecks.</span>' : '') };
    if (cov > amt) return { st: 'planned', html: '<b>Covered, with ' + money(cov - amt) + ' extra.</b><span>Lower one of the amounts below to free that money up.</span>' };
    if (cov === amt) return { st: 'planned', html: b.def.auto ? '<b>Automatic payment, and it’s covered.</b><span>It comes out on ' + dShort(b.ds) + ' and marks itself paid.</span>' : '<b>Covered. Money is lined up for the whole bill.</b>' };
    if (cov > 0) return { st: 'partial', html: '<b>' + money(amt - cov) + ' still needed.</b><span>' + money(cov) + ' of ' + money(amt) + ' is planned. Tap Use on another check to split it.</span>' };
    return { st: 'short', html: '<b>No money lined up yet.</b><span>Pick a paycheck below, or two to split it.</span>' };
  }
  function checkTally(c, dr) {
    if (c.skip) return { st: 'paid', html: '<b>No pay this time.</b><span>This payday is skipped, so it isn’t paying any bills.</span>' };
    const used = sumDraft(dr), spent = spentFrom(c.key), keep = untouchedFrom(c.key), left = dr.amount - used - spent - keep;
    if (left < 0) return { st: 'short', html: '<b>Over by ' + money(-left) + '.</b><span>' + money(used + spent + keep) + ' is assigned, but this check is ' + money(dr.amount) + '.</span>' };
    const next = left > 0 ? nextPayday(c.ds) : null, days = next ? Math.max(1, diffDays(c.ds, next)) : 0;
    const per = next ? '<span>About ' + money(Math.floor(left / days)) + ' a day until next payday on ' + dShort(next) + ' (' + days + ' ' + plural(days, 'day') + ').</span>' : '';
    return { st: 'money', html: '<b>' + money(left) + ' safe to spend.</b><span>' + money(used) + ' goes to bills' + (spent ? ' and ' + money(spent) + ' to unexpected expenses' : '') + '.' + (keep ? ' ' + money(keep) + ' stays untouched for savings.' : '') + '</span>' + per };
  }
  function tallyBox(r) { return '<div class="tally st-' + r.st + '" id="tally" aria-live="polite">' + r.html + '</div>'; }
  function billRowInfo(c, b, dr) {
    const free = c.amount - usedFrom(c.key, b.key) - spentFrom(c.key) - untouchedFrom(c.key), mine = dr.allocs[c.key];
    if (mine != null) { const after = free - mine; return { text: after >= 0 ? money(after) + ' left on this check' : 'Over by ' + money(-after), bad: after < 0 }; }
    return { text: free > 0 ? money(free) + ' free' : free === 0 ? 'Fully assigned' : 'Over by ' + money(-free), bad: free <= 0 };
  }
  function checkRowInfo(b, c, dr) {
    const need = b.amount - coveredFor(b.key, c.key), mine = dr.allocs[b.key];
    if (b.paid && mine == null) return { text: 'Paid' };
    if (mine != null) { const rest = need - mine; return { text: rest > 0 ? 'Still needs ' + money(rest) : rest === 0 ? 'Fully covered' : 'Covered, with ' + money(-rest) + ' extra' }; }
    return { text: need > 0 ? 'Needs ' + money(need) : 'Covered by other checks' };
  }
  function updateDraftView() {
    const top = topSheet();
    if (!top || !top.params.draft) return;
    const p = top.params, dr = p.draft;
    let r = null;
    if (top.kind === 'bill') {
      const b = billByKey(p.key); if (!b) return;

  function saveBar(p, label) {
    const conf = p.confirmClose ? '<div class="confirmbar" role="alert"><span>You have changes that aren’t saved.</span><div class="actions"><button type="button" class="btn solid" data-act="draft-save">Save</button><button type="button" class="btn" data-act="draft-discard">Don’t save</button><button type="button" class="btn" data-act="draft-keep">Keep editing</button></div></div>' : '';
    return conf + '<div class="savebar' + (p.dirty ? ' dirty' : '') + '"><span class="savestate">' + (p.dirty ? 'Changes not saved yet' : 'No changes yet') + '</span><button type="button" class="btn solid" data-act="draft-save"' + (p.dirty ? '' : ' disabled') + '>' + label + '</button></div>';

  function draftUse(d) {
    const top = topSheet();
    if (!top || !top.params.draft) return;
    const p = top.params, dr = p.draft;
    let fid = null;
    if (top.kind === 'bill') {
      const b = billByKey(p.key), c = checkByKey(d.check);
      if (!b || !c) return;
      const cov = sumDraft(dr), need = dr.amount - cov, free = c.amount - usedFrom(c.key, b.key) - spentFrom(c.key) - untouchedFrom(c.key);
      let amt;
      if (need > 0) amt = free > 0 ? Math.min(need, free) : need;
      else {
        // Already covered: split it. The new check takes an even share and the others give it up.
        const share = Math.round(dr.amount / (Object.keys(dr.allocs).length + 1));
        amt = free > 0 ? Math.min(share, free) : share;
        let extra = cov + amt - dr.amount;
        Object.keys(dr.allocs).sort((x, y) => dr.allocs[y] - dr.allocs[x]).forEach(k => { if (extra <= 0) return; const cut = Math.min(extra, dr.allocs[k]); dr.allocs[k] -= cut; extra -= cut; });
        Object.keys(dr.allocs).forEach(k => { if (dr.allocs[k] <= 0) delete dr.allocs[k]; });
      }
      dr.allocs[c.key] = Math.max(0, amt);
      fid = 'x:' + c.key;
    } else if (top.kind === 'check') {
      const c = checkByKey(p.key), b = billByKey(d.bill);
      if (!b || !c) return;
      const need = b.amount - coveredFor(b.key, c.key), left = dr.amount - sumDraft(dr) - spentFrom(c.key) - untouchedFrom(c.key);
      const amt = need > 0 ? (left > 0 ? Math.min(need, left) : need) : 0;
      if (amt <= 0) return;
      dr.allocs[b.key] = amt;
      fid = 'x:' + b.key;
    } else return;
    p.dirty = true;
    renderSheet(true, false, fid);
  }
  function saveDraft(top, extraFn, extraMsg) {
    const p = top.params, dr = p.draft;
    if (!dr) return;
    extraMsg = extraMsg || '';
    if (top.kind === 'bill') {
      const b = billByKey(p.key);
      if (!b) return;
      const ks = Object.keys(dr.allocs).filter(k => dr.allocs[k] > 0).sort((x, y) => (splitKey(x)[1] < splitKey(y)[1] ? -1 : 1));
      const desc = ks.length ? listJoin(ks.map(k => money(dr.allocs[k]) + ' from ' + dShort(splitKey(k)[1]))) : 'no paychecks yet';
      if (dr.amount !== b.amount) extraMsg = ' Amount due this time: ' + money(dr.amount) + '.' + extraMsg;
      commit(() => {
        setEdit('billEdits', b.key, 'amount', dr.amount === b.base ? null : dr.amount);
        if (b.def.nearest) setEdit('billEdits', b.key, 'manual', true);
        S.allocs = S.allocs.filter(a => a.bill !== b.key);
        ks.forEach(k => S.allocs.push({ bill: b.key, check: k, amount: dr.allocs[k] }));
        if (extraFn) extraFn();
      }, { toast: 'Saved. ' + b.name + ': ' + desc + '.' + extraMsg, undo: true, quietPrune: true, log: 'Saved the plan for ' + b.name + ' (due ' + dShort(b.ds) + '): ' + desc + '.' + extraMsg });
    } else if (top.kind === 'check') {
      const c = checkByKey(p.key);
      if (!c) return;
      const ks = Object.keys(dr.allocs).filter(k => dr.allocs[k] > 0);
      const names = ks.map(k => { const b = billByKey(k); return b ? b.name + ' ' + money(dr.allocs[k]) : ''; }).filter(Boolean);
      const desc = names.length ? listJoin(names) : 'no bills';
      if (dr.amount !== c.amount) extraMsg = ' Amount this payday: ' + money(dr.amount) + '.' + extraMsg;
      const dropped = (IDX.byCheck.get(c.key) || []).filter(a => a.auto && !(dr.allocs[a.bill] > 0)).map(a => a.bill);
      commit(() => {
        dropped.forEach(k => setEdit('billEdits', k, 'manual', true));
        setEdit('checkEdits', c.key, 'amount', dr.amount === c.base ? null : dr.amount);
        S.allocs = S.allocs.filter(a => a.check !== c.key);
        ks.forEach(k => S.allocs.push({ bill: k, check: c.key, amount: dr.allocs[k] }));
        if (extraFn) extraFn();
      }, { toast: 'Saved. The ' + dShort(c.ds) + ' paycheck pays ' + desc + '.' + extraMsg, undo: true, quietPrune: true, log: 'Saved the plan for the ' + dShort(c.ds) + ' paycheck: ' + desc + '.' + extraMsg });
    }
    p.dirty = false;
    p.confirmClose = false;
    p.draft = null;
  }

  function expenseChecks(ds, keep) {
    const list = checksIn(addDays(ds, -35), addDays(ds, 7));
    if (keep && !list.some(c => c.key === keep)) { const c = checkByKey(keep); if (c && !c.skip) list.push(c); }
    return list.sort(byDate).reverse();
  }
  function expenseOptions(ds, sel, x) {

    }).join('') + '<option value=""' + (!sel ? ' selected' : '') + '>Not from a specific paycheck</option>';
  }

    box.innerHTML = expenseOptions(ds, keep, x);
  }

  function sheetAbout() {
    return sheetHead('About this planner') + '<div class="about">' +
      '<p><b>Payday Planner is for tracking, mapping and planning your money.</b> It’s interactive and depends on your real money moves: paydays, bills you pay, surprise expenses. It never connects to your bank and only knows what you tell it, so if it isn’t updated, its numbers won’t match your real money. The only set-and-forget parts are the ones you’ve automated in your bank apps, like automatic transfers or autopay.</p>' +
      '<p>It’s built for structured, safer spending, and it works for simple or messy money setups.</p>' +
      '<p>It works one deposit at a time. Each one covers the bills you give it, and whatever is left becomes what’s safe to spend, spread evenly until your next deposit.</p>' +
      '<p>It assumes things go according to plan. Bills with money lined up count as paid on their due dates, and savings money counts as set aside on each deposit day. If something didn’t happen, open it and change it.</p>' +
      '<p>Savings goals leave part of each deposit untouched. Nothing moves anywhere: that money is kept out of what’s safe to spend, so it stays in the account it came into and your balance grows on its own.</p>' +
      '<p>Anything already sitting in your account before your first planned deposit isn’t counted either, so it stays put as a cushion. If every bill is in the planner and you stay within what’s safe to spend, you’ll never spend more than you bring in.</p>' +
      '<p class="fine">Prices, bank fees and surprises can still happen, so check your real balance before big purchases. This planner is a tool for staying organized, not financial advice.</p></div>';
  }

  function readGoal(f) {
    const fd = new FormData(f), method = METHODS[fd.get('method')] ? String(fd.get('method')) : 'date';
    const g = { id: f.dataset.id || 'preview', name: String(fd.get('name') || '').trim().slice(0, 60) || 'Savings goal', target: parseMoney(fd.get('target')), method, start: String(fd.get('start') || '') };
    if (method === 'date') g.date = String(fd.get('date') || '');
    if (method === 'amount') g.amount = parseMoney(fd.get('amount'));
    if (method === 'percent') g.percent = Number(String(fd.get('percent') || '').replace(/[^0-9.]/g, ''));
    const boxes = $$('input[name="from"]', f);
    g.from = !boxes.length || boxes.every(b => b.checked) ? 'all' : boxes.filter(b => b.checked).map(b => b.value);
    return g;
  }
  function goalProblem(g) {
    if (!(g.target > 0)) return 'Enter a goal amount, like 500.00.';
    if (!isDate(g.start)) return 'Pick a starting date.';
    if (g.method === 'date' && (!isDate(g.date) || g.date < g.start)) return 'Pick a date after the starting date.';
    if (g.method === 'amount' && !(g.amount > 0)) return 'Enter how much to leave untouched from each deposit.';
    if (g.method === 'percent' && !(g.percent > 0 && g.percent <= 100)) return 'Enter a percent from 1 to 100.';
    if (Array.isArray(g.from) && !g.from.length) return 'Pick at least one kind of income to take from.';
    return '';
  }
  function goalPreviewHtml(g) {
    if (goalProblem(g)) return '<p class="help">Fill in the goal to see how it plays out.</p>';
    const rows = planFor(g), sum = rows.reduce((s, x) => s + x.amount, 0);
    if (!rows.length) return '<p class="help">No deposits in the planner fall between these dates yet.</p>';
    let reach = null, cum = 0;
    for (const x of rows) { cum += x.amount; if (cum >= g.target) { reach = x.ds; break; } }
    const per = g.method === 'date' ? 'About ' + money(rows[0].amount) + ' from each deposit' : g.method === 'amount' ? money(g.amount) + ' from each deposit' : g.percent + '% of each deposit, ' + money(rows[0].amount) + ' from the first one';
    const nd = nextPayday(rows[0].ds), days = nd ? Math.max(1, diffDays(rows[0].ds, nd)) : 7;
    return '<span class="nlbl">How it plays out</span><p class="help">' + esc(per) + '. ' + (reach ? 'Reached ' + (g.method === 'date' ? 'by ' : 'around ') + dMed(reach) + '.' : 'Short by ' + money(g.target - sum) + (g.method === 'date' ? ' by ' + dMed(g.date) : '') + ' with the deposits in the planner now.') + '</p>' +
      '<p class="help">Your daily amounts drop by about ' + money(Math.round(rows[0].amount / days)) + ' while it builds.</p>';
  }
  function refreshGoal(f) { const box = f.querySelector('#goalinfo'); if (box) box.innerHTML = goalPreviewHtml(readGoal(f)); }
  function saveGoal(f) {
    const g = readGoal(f), err = m => { f.querySelector('.err').textContent = m; };
    const bad = goalProblem(g);
    if (bad) return err(bad);
    const id = f.dataset.id;
    g.id = id || uid();
    const how = g.method === 'date' ? 'by ' + dMed(g.date) : g.method === 'amount' ? money(g.amount) + ' from every deposit' : g.percent + '% of every deposit';
    closeAllSheets();
    UI.tab = 'sum';
    UI.sub = 'savings';
    UI.openGoals.add(g.id);
    commit(() => { const i = S.goals.findIndex(x => x.id === g.id); if (i >= 0) S.goals[i] = g; else S.goals.push(g); },
      { toast: 'Saved. ' + g.name + ': ' + money(g.target) + ', ' + how + '.', undo: true, log: (id ? 'Edited savings goal: ' : 'Added savings goal: ') + g.name + ', ' + money(g.target) + ', ' + how + '.' });
    window.scrollTo(0, 0);
  }

    s.sources.push({ id: uid(), name: 'Side gig', kind: 'gig', lands: 'Cash App', amount: 25000, freq: 'once', start: cur + '-20' });
    s.goals.push({ id: uid(), name: 'Emergency fund', target: 50000, method: 'date', date: monthRange(shiftMonth(cur, 2))[1], start: cur + '-01', from: 'all' },
      { id: uid(), name: 'Car fund', target: 60000, method: 'amount', amount: 2000, start: cur + '-01', from: 'all' });
    const mk = (name, amount, day) => ({ id: uid(), name, amount, freq: 'monthly', start: prev + '-' + pad(day) });
    s.bills.push(mk('Rent', 105000, 1), mk('Internet', 6000, 5), mk('Streaming', 1599, 9), mk('Phone', 6500, 12), mk('Car insurance', 13500, 18), mk('Electric', 11000, 22), mk('Car payment', 28500, 26));
    S = s;

    // Set a piece of rent aside from each paycheck in the four weeks before it's due,
    // the way most people budget for it, so no single check gets swallowed whole.
    billsIn(prev + '-01', monthRange(shiftMonth(cur, 1))[1]).filter(b => b.name === 'Rent').forEach(b => {
      const cs = checksIn(addDays(b.ds, -28), addDays(b.ds, -1)).filter(c => c.src && c.src.freq === 'weekly');
      if (!cs.length) return;
      const each = Math.floor(b.amount / cs.length);
      cs.forEach((c, i) => setAlloc(b.key, c.key, i === cs.length - 1 ? b.amount - each * (cs.length - 1) : each));
